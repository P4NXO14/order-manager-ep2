name: OrderManager CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas cobertura y SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar pruebas y validar cobertura
        run: mvn -B -ntp clean verify

      - name: Verificar reporte JaCoCo
        run: test -f target/site/jacoco/jacoco.xml

      - name: Configurar Java 21 para SonarQube
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verificar secreto SonarQube
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN no esta configurado"
            exit 1
          fi

      - name: Analizar SonarQube y validar Quality Gate
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.scanner.skipJreProvisioning=true
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-jacoco
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: warn

  despliegue:
    name: Despliegue simulado con Docker
    needs: pruebas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t order-manager:ep2 .

      - name: Generar credenciales temporales
        run: |
          umask 077
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Iniciar contenedores
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Comprobar salud de OrderManager
        run: |
          curl -fsS http://localhost:8098/actuator/health | grep -q '"status":"UP"'

      - name: Crear pedido de prueba
        run: |
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -d '{"customerName":"Cliente CI","items":[{"productName":"Mouse","quantity":1,"unitPrice":1500}]}' \
            http://localhost:8098/api/orders

      - name: Comprobar persistencia
        run: |
          docker compose down
          docker compose up -d --no-build --wait --wait-timeout 180
          curl -fsS http://localhost:8098/api/orders/1 | grep -q '"customerName":"Cliente CI"'

      - name: Mostrar diagnostico de errores
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=100 || true

      - name: Limpiar entorno
        if: always()
        run: |
          docker compose down --remove-orphans || true
          rm -f .env